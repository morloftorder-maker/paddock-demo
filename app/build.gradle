plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.paddock.demo'
    compileSdk 34

    defaultConfig {
        applicationId 'ca.paddock.demo'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.4-demo'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signée avec la clé de débogage : installable directement, sans Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

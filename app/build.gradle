plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.paddock.demo'
    compileSdk 34

    defaultConfig {
        applicationId 'ca.paddock.demo'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.4-demo'
    }

    // Clé fixe de la démo : chaque nouvel APK peut s'installer par-dessus le précédent.
    // (Pour une vraie publication, utiliser une clé privée gardée hors du dépôt.)
    signingConfigs {
        demo {
            storeFile file('paddock-demo.keystore')
            storePassword 'paddockdemo'
            keyAlias 'paddock'
            keyPassword 'paddockdemo'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

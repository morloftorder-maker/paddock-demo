<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Paddock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: un vrai produit, net et sportif, comme l'appli officielle d'une série de course
   IDEA: le paddock un jour de course: drapeau à damier, plaques numérotées, bandes de couleur
   PICTURE: l'appli elle-même; chaque pilote porte sa plaque sur une bande aux couleurs de sa discipline
   COLOUR and TYPE: noir et blanc qui dominent, rouge signal, jaune drapeau; Barlow Condensed + Barlow
   LAYOUT: colonne mobile, barre du haut noire avec damier, navigation fixe en bas */
:root{color-scheme:light;--bg:#f4f4f1;--card:#fff;--ink:#111316;--mut:#585e66;--line:#dedfd9;--rs:#fde8e6;--grn:#0c8a3a;--blu:#e7eeff;--blu2:#1f45c8;--trb:#e6f4ea;--clb:#fff8d6;--red:#e10600;--yel:#ffd200;--blk:#121417;--cf:'Barlow Condensed','sans-serif-condensed','Roboto Condensed','Arial Narrow',sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d0f11;--card:#181b1f;--ink:#eff1f3;--mut:#9fa6ae;--line:#2b2f35;--rs:#3b1513;--grn:#33c56a;--blu:#14204a;--blu2:#9db5ff;--trb:#12301d;--clb:#2d2808}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0d0f11;--card:#181b1f;--ink:#eff1f3;--mut:#9fa6ae;--line:#2b2f35;--rs:#3b1513;--grn:#33c56a;--blu:#14204a;--blu2:#9db5ff;--trb:#12301d;--clb:#2d2808}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--blk);color:#fff;padding-top:env(safe-area-inset-top)}
.top>div{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px}
.top::after{content:"";display:block;height:8px;background:repeating-conic-gradient(#fff 0 25%,#121417 0 50%) 0 0/8px 8px}
.ib{width:44px;height:44px;border:0;background:none;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:10px;position:relative}
.ib svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.ib .cnt{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:700 12px/18px Barlow,sans-serif;padding:0 4px}
.logo{font:italic 800 30px/1 var(--cf);letter-spacing:.03em;text-decoration:none;margin-right:auto}
.logo span{color:var(--yel)}
main{max-width:560px;margin:0 auto;padding:8px 14px calc(100px + env(safe-area-inset-bottom))}
body.out main{padding-bottom:40px}
h1{font:800 36px/1.05 var(--cf);margin:8px 0 4px;text-wrap:balance}
h2{font:700 24px/1.1 var(--cf);margin:24px 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:20px;background:var(--red);border-radius:2px;transform:skewX(-14deg);flex:none}
h3{font:700 19px/1.15 var(--cf);margin:0}
p{margin:6px 0}
.mut{color:var(--mut)}.sm{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.link{display:block;text-decoration:none;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.yel{background:var(--yel);border-color:var(--yel);color:#111}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.w{width:100%}.btn.sm2{min-height:36px;padding:0 12px;font-size:14px}
.btn.dan{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.dc:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible,.chip:focus-visible,.ib:focus-visible,.li:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);font:500 14px Barlow,sans-serif;color:var(--ink);cursor:pointer;text-decoration:none;min-height:34px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff7a00 60%,var(--yel));border-radius:99px}
.v{display:inline-flex;vertical-align:-3px}
.back{background:none;border:0;color:var(--mut);font:600 16px Barlow,sans-serif;padding:10px 0;cursor:pointer;min-height:44px}
.tag{display:inline-block;font:600 13px Barlow,sans-serif;padding:2px 8px;border-radius:6px;background:var(--rs);color:var(--red)}
.tag.f{background:var(--yel);color:#111}
.tag.r{background:var(--trb);color:var(--grn)}
.tag.u{background:var(--blu);color:var(--blu2)}
.plate{flex:none;width:84px;height:68px;border-radius:12px;background:#fff;color:#111;border:3px solid #111;display:grid;place-items:center;font:italic 800 44px/1 var(--cf);position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.3);padding-top:6px}
.plate.s{width:52px;height:42px;font-size:26px;border-width:2px;border-radius:9px;padding-top:4px}
.plate.i{font-size:32px}.plate.s.i{font-size:19px}
.plate::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--pc,#e10600)}
.plate.s::before{height:6px}
.av{flex:none;width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--yel);background:var(--line)}
.av.l{width:84px;height:84px;border-width:3px}
.avi{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--blk);color:var(--yel);font:italic 800 22px var(--cf);border:2px solid var(--yel)}
.avi.l{width:84px;height:84px;font-size:34px}
.band{margin:0 -14px;padding:18px 14px 20px;color:#fff;background:linear-gradient(100deg,#121417 52%,rgba(18,20,23,.55) 75%,transparent),repeating-linear-gradient(115deg,var(--dc) 0 16px,#121417 16px 34px)}
.band h1{color:#fff}.band .mut{color:#c6cacf}.band a{color:#fff}
.hero{display:flex;gap:12px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0}
.stats div{background:var(--blk);color:#fff;border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font:700 26px/1 var(--cf);color:var(--yel)}
.stats span{font-size:13px;color:#c6cacf}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-weight:600;color:var(--mut);font-size:13px}td.r,th.r{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sched{list-style:none;padding:0;margin:0}.sched li{display:grid;grid-template-columns:4.6em 1fr;padding:8px 0;border-bottom:1px solid var(--line)}.sched li:last-child{border:0}
.sched b{font:700 20px/1.1 var(--cf);white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.tabs .chip{flex:none}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font:600 13px Barlow,sans-serif;color:var(--mut);text-align:center;padding:4px 0}
.dc{aspect-ratio:1/1.12;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:5px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;font:700 17px/1 var(--cf);color:var(--ink)}
.dc.has{border:1.5px solid var(--ink);background:var(--card);background:color-mix(in srgb,var(--hc) 16%,var(--card))}.dc.today{box-shadow:inset 0 0 0 2px var(--red)}
.dc .dots{margin-top:auto;display:flex;gap:3px;flex-wrap:wrap}.dc .dots .dot{width:8px;height:8px}
.dc.blank{visibility:hidden}
.mh{display:flex;align-items:center;gap:8px;margin:6px 0 10px}.mh h1{margin:0;flex:1;text-transform:capitalize}
.fl{display:grid;gap:12px}
label.f{display:grid;gap:4px;font:600 14px Barlow,sans-serif}
input[type=range]{width:100%;accent-color:var(--red);min-height:30px}
select,input[type=number],input[type=search],input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],input[type=time],textarea{min-height:46px;font:16px Barlow,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
input[type=file]{font:15px Barlow,sans-serif;max-width:100%}
.err{background:var(--rs);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px}
.ev{display:grid;grid-template-columns:8px 1fr;gap:12px;background:var(--card);background:linear-gradient(90deg,color-mix(in srgb,var(--ec) 10%,var(--card)),var(--card) 60%)}.ev>i{border-radius:4px;background:var(--ec)}
.dayz{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;will-change:transform;padding-top:env(safe-area-inset-top)}
.dayz .in{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.bign{font:italic 800 104px/.9 var(--cf);color:var(--red);text-shadow:4px 4px 0 var(--yel)}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--blk);padding-bottom:env(safe-area-inset-bottom)}
nav.bot div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bot a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font:600 13px Barlow,sans-serif;color:#aeb3b9;text-decoration:none;min-height:56px;position:relative}
nav.bot a.on{color:#fff}nav.bot a.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--yel);border-radius:0 0 3px 3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.out nav.bot,body.out .top .ib{display:none}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .25s ease;border-top:6px solid var(--yel)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:61;background:var(--card);overflow:auto;animation:sl .22s ease;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sl{from{transform:translateX(-30px);opacity:.3}}
.dh{background:linear-gradient(100deg,#121417 50%,rgba(18,20,23,.6) 80%,transparent),repeating-linear-gradient(115deg,var(--yel) 0 16px,#121417 16px 34px);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 16px 18px}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 16px Barlow,sans-serif;text-align:left;cursor:pointer;text-decoration:none}
.li svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--mut)}
.li .r{margin-left:auto;color:var(--mut);font-size:14px;text-align:right}
.li.dan{color:var(--red)}.li.dan svg{color:var(--red)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0 18px}
.grp .li:last-child{border-bottom:0}
.gt{font:600 13px Barlow,sans-serif;color:var(--mut);margin:18px 4px 0;text-transform:none}
.sw{position:relative;width:50px;height:30px;flex:none;margin-left:auto}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--grn)}.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--red);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border-radius:10px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:8px;background:none;color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.amts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.tier{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card);color:var(--ink);width:100%;text-align:left;font:inherit}
.tier.on{border-color:var(--red);background:var(--rs)}
.badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:italic 800 20px var(--cf);color:#111}
.sum{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0}
.sum div{display:flex;justify-content:space-between;gap:8px}.sum b{white-space:nowrap}
.step{display:flex;align-items:center;gap:10px}.step b{min-width:2ch;text-align:center;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--blk);color:#fff;padding:12px 16px;border-radius:12px;z-index:80;max-width:calc(100% - 28px);font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3);border-left:5px solid var(--yel)}
.lv{display:flex;gap:16px;align-items:center;border-radius:16px;padding:16px;margin:10px 0;color:#fff;background:linear-gradient(100deg,#121417 55%,rgba(18,20,23,.6) 80%,transparent),repeating-linear-gradient(115deg,var(--yel) 0 16px,#121417 16px 34px)}
.lvl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.lvl div{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:13px}.lvl div.ok{background:var(--yel);color:#111;border-color:var(--yel)}
.lvl b{display:block;font:700 18px var(--cf)}
.proof{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 8px;background:var(--bg);border-radius:8px;margin-top:6px}
.proof img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.claim{background:var(--clb);border:1px solid var(--yel)}
.fc{border-left:5px solid var(--ec)}
.note{font-size:13px;color:var(--mut);margin-top:28px}
.wel{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;gap:12px}
.wel .big{font:italic 800 clamp(64px,22vw,104px)/.9 var(--cf);margin:0}.wel .big span{color:var(--red)}
.wel .flag{height:22px;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/22px 22px;border-radius:4px;width:66%}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 14px}.prog i{height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--red)}
.rc{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}
.rc input{width:22px;height:22px;margin-top:2px;accent-color:var(--red);flex:none}
.rc:has(input:checked){border-color:var(--red);background:var(--rs)}
.nt{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.nt.un{background:var(--clb);background:color-mix(in srgb,var(--yel) 12%,transparent)}
.nt .d{width:10px;height:10px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}.nt .d.o{background:transparent}
@media(prefers-reduced-motion:reduce){.sheet,.drawer{animation:none}.dayz{transition:none!important}}
</style></head><body>

<script>
{
const D={ra:['Rallye','#0a8a43'],dr:['Drift','#e0217a'],ka:['Karting','#1f5fff'],mn:['Motoneige','#0096c7'],gl:['Course sur glace','#7b5cff']};
/* Lieux. lat/lon approximatives. cap = capacité déclarée (valeurs d'exemple). */
const BT={
tm:{nom:'Maniwaki',ville:'Maniwaki (Haute-Gatineau)',lat:46.38,lon:-75.97,cap:5000,host:1,desc:'Spéciales sur routes forestières enneigées et glacées de la Haute-Gatineau.'},

tsh:{nom:'SH Karting',ville:'Mont-Saint-Hilaire',lat:45.56,lon:-73.19,cap:2000,desc:'Deux pistes de 700 m qu’on peut combiner.'},
ttr:{nom:'Karting Trois-Rivières',ville:'Trois-Rivières',lat:46.35,lon:-72.55,cap:2000,desc:'Piste de karting de la Mauricie.'},

   <label class="rc"><input type="checkbox" id="r_com" ${d.com?'checked':''}><span><b>Commanditaire</b><br><span class="sm mut">Publier des offres de commandite et appuyer des pilotes.</span></span></label>`;
  if(st===3)body=`<h1>Détails</h1><p class="mut">Étape 3 sur 4</p>${roleForms(d,minor)}${!d.pil&&!d.org&&!d.com?'<div class="card">Rien à ajouter pour un compte visiteur. Passez à l’étape suivante.</div>':''}`;
  if(st===4)body=`<h1>Photo de profil</h1><p class="mut">Étape 4 sur 4 · Facultatif</p>
   <div class="row" style="margin:12px 0">${d.photo?`<img class="av l" src="${okImg(d.photo)}" alt="">`:`<div class="avi l">${esc(ini(d.nom||'?'))}</div>`}<label class="btn">Choisir une photo<input type="file" accept="image/*" data-photo="su" hidden></label>${d.photo?'<button class="btn" data-act="sunophoto">Retirer</button>':''}</div>
   <label class="rc"><input type="checkbox" id="s_cgu" ${d.cgu?'checked':''}><span>J’accepte les conditions d’utilisation et la politique de confidentialité de la démo.</span></label>

  return `<button class="back" data-act="suback">‹ ${st===1?'Annuler':'Étape précédente'}</button><div class="prog">${[1,2,3,4].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>${body}
  ${UI.err?`<div class="err" style="margin-top:12px">${esc(UI.err)}</div>`:''}
  <button class="btn pri w" style="margin-top:16px" data-act="sunext">${st===4?'Créer mon compte':'Continuer'}</button>`;

function roleForms(d,minor,only){
  const dopt=v=>Object.entries(D).map(([k,x])=>`<option value="${k}"${k===v?' selected':''}>${x[0]}</option>`).join('');
  let h='<datalist id="dl_ser">'+SERIES.map(s=>`<option value="${s}">`).join('')+'</datalist>';
  if(d.pil&&(!only||only==='pil'))h+=`<div class="card fl"><h3>Profil pilote</h3>
   <label class="f">Discipline<select id="p_d">${dopt(d.p_d||'ra')}</select></label>
   <label class="f">Série principale<input type="text" id="p_serie" list="dl_ser" value="${esc(d.p_serie||'')}" placeholder="Ex. DMCC"></label>
   <label class="f">Classe<input type="text" id="p_classe" value="${esc(d.p_classe||'')}" placeholder="Ex. Pro-Am"></label>
   <label class="f">Numéro de course<input type="text" id="p_num" inputmode="numeric" maxlength="4" value="${esc(d.p_num||'')}"></label>
   <label class="f">Écurie ou équipe (facultatif)<input type="text" id="p_eq" value="${esc(d.p_eq||'')}"></label>
   <label class="f">Présentation<textarea id="p_bio" maxlength="400">${esc(d.p_bio||'')}</textarea></label>
   ${minor?`<div class="card" style="background:var(--rs);border-color:transparent;margin:0"><b>Pilote mineur :</b> un parent doit gérer le compte et recevoir les fonds.</div>
   <label class="f">Nom du parent gestionnaire<input type="text" id="p_par" value="${esc(d.p_par||'')}"></label>
   <label class="f">Courriel du parent<input type="email" id="p_parm" value="${esc(d.p_parm||'')}"></label>`:''}</div>`;
  if(d.org&&(!only||only==='org'))h+=`<div class="card fl"><h3>Organisateur</h3>
   <label class="f">Nom de l’organisation<input type="text" id="o_nom" value="${esc(d.o_nom||'')}" placeholder="Ex. Club Rallye de la Beauce"></label>
   <label class="f">Site web (facultatif)<input type="url" id="o_site" value="${esc(d.o_site||'')}"></label></div>`;
  if(d.com&&(!only||only==='com'))h+=`<div class="card fl"><h3>Commanditaire</h3>
   <label class="f">Nom de l’entreprise<input type="text" id="c_nom" value="${esc(d.c_nom||'')}"></label>
   <label class="f">Secteur<input type="text" id="c_sect" value="${esc(d.c_sect||'')}" placeholder="Ex. Pneus et mécanique"></label>
   <label class="f">Description<textarea id="c_desc" maxlength="400">${esc(d.c_desc||'')}</textarea></label></div>`;
  return h;
}
const val=id=>{const x=document.getElementById(id);return x?x.value.trim():undefined};
const chk=id=>{const x=document.getElementById(id);return x?x.checked:undefined};
function readRoleForms(d){
  for(const k of ['p_d','p_serie','p_classe','p_num','p_eq','p_bio','p_par','p_parm','o_nom','o_site','c_nom','c_sect','c_desc']){const v=val(k);if(v!==undefined)d[k]=v}
}
function checkRoleForms(d,minor){
  if(d.pil){if(!d.p_serie)return 'Indiquez votre série principale.';if(d.p_num&&!/^\d{1,4}$/.test(d.p_num))return 'Le numéro de course doit contenir seulement des chiffres.';
    if(minor&&(!d.p_par||!/^\S+@\S+\.\S+$/.test(d.p_parm||'')))return 'Un pilote mineur doit indiquer le nom et le courriel d’un parent.'}
  if(d.org&&!d.o_nom)return 'Indiquez le nom de votre organisation.';
  if(d.com&&(!d.c_nom||!d.c_sect))return 'Indiquez le nom et le secteur de votre entreprise.';
  return '';
}
function applyRoles(a,d){
  if(d.pil){a.roles.pilote=1;a.pilote=Object.assign(a.pilote||{obj:[],post:''},{d:d.p_d||'ra',serie:d.p_serie,classe:d.p_classe||'',num:d.p_num||'',eq:d.p_eq||'',bio:d.p_bio||'',parent:age(a.naissance)<18?d.p_par:'',parentEmail:age(a.naissance)<18?d.p_parm:''})}
  if(d.org){a.roles.org=1;a.org={nom:d.o_nom,site:d.o_site||''}}
  if(d.com){a.roles.com=1;a.com={nom:d.c_nom,sect:d.c_sect,desc:d.c_desc||''}}
}
function suNext(){
  const s=UI.su,d=s.d;UI.err='';
  if(s.step===1){d.nom=val('s_nom');d.email=val('s_email').toLowerCase();const pw=$('#s_pw').value;d.ville=val('s_ville');d.naissance=val('s_nais');
    if(!d.nom||d.nom.length<2)UI.err='Entrez votre prénom et votre nom.';
    else if(!/^\S+@\S+\.\S+$/.test(d.email))UI.err='Entrez un courriel valide.';
    else if(Object.values(db.accounts).some(a=>a.email===d.email))UI.err='Un compte existe déjà avec ce courriel sur cet appareil.';
    else if(pw.length<6&&!d.pw)UI.err='Le mot de passe doit avoir au moins 6 caractères.';
    else if(!d.naissance)UI.err='Entrez votre date de naissance.';
    else if(age(d.naissance)<13)UI.err='Il faut avoir 13 ans ou plus. Un parent peut créer le compte.';
    if(pw.length>=6)d.pw=hpw(pw);
  }else if(s.step===2){d.pil=chk('r_pil');d.org=chk('r_org');d.com=chk('r_com');
    if(age(d.naissance)<18&&(d.org||d.com))UI.err='Les rôles organisateur et commanditaire sont réservés aux 18 ans et plus.';
  }else if(s.step===3){readRoleForms(d);UI.err=checkRoleForms(d,age(d.naissance)<18)}
  else if(s.step===4){d.cgu=chk('s_cgu');if(!d.cgu)UI.err='Acceptez les conditions pour créer le compte.';else return createAccount()}
  if(!UI.err)s.step++;
  draw();scrollTo(0,0);
}
function createAccount(){
  const d=UI.su.d,a=newAcc();a.id=nid();a.nom=d.nom;a.email=d.email;a.pw=d.pw;a.ville=d.ville;a.naissance=d.naissance;a.photo=okImg(d.photo);
  applyRoles(a,d);db.accounts[a.id]=a;db.cur=a.id;
  notify(a.id,'Bienvenue sur Paddock, '+esc(a.nom.split(' ')[0])+'! Votre compte est prêt.','#moi');
  if(a.roles.pilote){post(a.pilote.d,`Nouveau pilote sur Paddock : <b>${esc(a.nom)}</b> (${esc(a.pilote.serie)}${a.pilote.num?' · no '+esc(a.pilote.num):''}).`,pidOf(a));notify(a.id,'Vérification d’identité simulée : approuvée. Vous pouvez créer votre cagnotte.','#moi')}
  if(a.roles.org)post('any',`Nouvel organisateur : <b>${esc(a.org.nom)}</b>.`);
  if(a.roles.com)post('any',`Nouveau commanditaire : <b>${esc(a.com.nom)}</b> (${esc(a.com.sect)}).`);
  if(!persist()){a.photo='';persist()}
  UI.su={step:1,d:{}};UI.err='';location.hash='moi';toast('Compte créé. Bienvenue, '+a.nom.split(' ')[0]+'!');
}
function doLogin(){
  const e=val('le').toLowerCase(),p=$('#lp').value,a=Object.values(db.accounts).find(x=>x.email===e);
  if(!a){UI.err='Aucun compte avec ce courriel sur cet appareil.';UI.lemail=e;return draw()}
  if(a.pw!==hpw(p)){UI.err='Mot de passe incorrect.';UI.lemail=e;return draw()}
  db.cur=a.id;UI.err='';UI.lemail='';persist();applyTheme();location.hash='fil';toast('Bon retour, '+a.nom.split(' ')[0]+'!');
}
function logout(){db.cur=null;persist();closeSheet();applyTheme();location.hash='bienvenue';toast('Vous êtes déconnecté.')}

/* ---------- Calendrier ---------- */
function filtered(){const f=UI.f;return E.filter(e=>(f.dist>=5000||dist(e)<=f.dist)&&T[e.tr].cap>=f.cap&&(!f.ds.length||f.ds.includes(e.d))&&(f.per==='tous'||(f.per==='venir'?!past(e):past(e))))}

  const y=UI.cy,m=UI.cm,first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  const ev=filtered(),f=UI.f,nf=(f.dist<5000)+(f.cap>0)+(f.ds.length>0)+(f.per!=='tous');
  let cells='';for(let i=0;i<off;i++)cells+='<div class="dc blank"></div>';
  for(let d=1;d<=n;d++){const k=key(new Date(y,m,d)),l=ev.filter(e=>days(e).includes(k));
    cells+=`<button class="dc${l.length?' has':''}${k===key(TODAY)?' today':''}" ${l.length?`style="--hc:${D[l[0].d][1]}"`:''} data-day="${k}" aria-label="${d}, ${l.length} événement(s)">${d}<span class="dots">${l.map(e=>`<span class="dot" style="background:${D[e.d][1]}"></span>`).join('')}</span></button>`}
  const month=new Date(y,m,1).toLocaleDateString('fr-CA',{month:'long',year:'numeric'});
  const list=ev.filter(e=>days(e).some(k=>{const d=pd(k);return d.getFullYear()===y&&d.getMonth()===m}));

  return `<div class="mh"><button class="btn" data-act="mprev" aria-label="Mois précédent">‹</button><h1>${month}</h1><button class="btn" data-act="mnext" aria-label="Mois suivant">›</button></div>
  <div class="row" style="margin-bottom:10px"><button class="btn${UI.showF?' on':''}" data-act="tf">Filtres${nf?` (${nf})`:''}</button><button class="btn" data-act="today">Aujourd’hui</button>${a.roles.org?'<a class="btn yel" href="#creer-evenement">+ Événement</a>':''}</div>
  ${UI.showF?`<div class="card fl">
   <label class="f">Distance de ${home().nom} : <span id="dv">${DV(f.dist)}</span><input type="range" id="fd" min="50" max="5000" step="50" value="${f.dist}"></label>
   <label class="f">Capacité de spectateurs (déclarée par l’organisateur)<select id="fc">${[[0,'Toutes'],[2000,'2 000 et plus'],[5000,'5 000 et plus'],[10000,'10 000 et plus']].map(([v,t])=>`<option value="${v}"${f.cap==v?' selected':''}>${t}</option>`).join('')}</select></label>
   <label class="f">Période<select id="fp">${[['tous','Tous les événements'],['venir','À venir seulement'],['passes','Terminés seulement']].map(([v,t])=>`<option value="${v}"${f.per===v?' selected':''}>${t}</option>`).join('')}</select></label>
   <div><div class="sm" style="font-weight:600;margin-bottom:6px">Type d’événement</div><div class="row" style="gap:6px">${Object.entries(D).map(([k,v])=>`<button class="chip${f.ds.includes(k)?' on':''}" data-fd="${k}"><span class="dot" style="background:${v[1]}"></span>${v[0]}</button>`).join('')}</div></div>
   <button class="btn" data-act="fr">Effacer les filtres</button></div>`:''}
  <div class="grid7">${['Lu','Ma','Me','Je','Ve','Sa','Di'].map(x=>`<div class="wd">${x}</div>`).join('')}${cells}</div>
  <p class="sm mut">Touchez une journée pour l’agrandir. ${list.length} événement(s) ce mois-ci.</p>
  <h2>Ce mois-ci</h2>${list.length?list.map(e=>erow(e)).join(''):'<div class="card mut">Aucun événement ne correspond à vos filtres ce mois-ci.</div>'}`;

function dayHTML(k){
  const all=E.filter(e=>days(e).includes(k)),l=filtered().filter(e=>days(e).includes(k)),d=pd(k),hid=all.length-l.length;

let zc=null;const rm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function openDay(k,cell){
  const z=$('#dayz'),r=cell.getBoundingClientRect();z.innerHTML=dayHTML(k);z.hidden=false;z.scrollTop=0;zc=cell;

  ${TIERS.map(t=>`<button class="tier${sb.t===t[0]?' on':''}" data-tier="${t[0]}"><span class="badge" style="background:${t[3]}">${t[1][0]}</span><span><b>${t[1]}</b><br><span class="sm mut">${t[2]}</span></span><b>${fmt(t[0])}/mois</b></button>`).join('')}
  ${sum(sb.t,'Le pilote')}${payLine()}<button class="btn pri w" data-act="sok">Confirmer l’abonnement</button>
  ${me().sub[sb.id]?'<button class="btn w" style="margin-top:8px" data-act="sstop">Annuler mon abonnement</button>':''}`)}
function tixSheet(){const e=EV[tx.id],amt=tx.a*e.b[1]+tx.k*e.b[2];
  openSheet(`${sheetH('Billets — '+e.t,drange(e))}
  <div class="row" style="justify-content:space-between;margin:10px 0"><span>Adulte · ${fmt(e.b[1])}</span><span class="step"><button class="btn" data-q="a-" aria-label="Moins">−</button><b>${tx.a}</b><button class="btn" data-q="a+" aria-label="Plus">+</button></span></div>
  <div class="row" style="justify-content:space-between;margin:10px 0"><span>Enfant · ${e.b[2]?fmt(e.b[2]):'gratuit'}</span><span class="step"><button class="btn" data-q="k-" aria-label="Moins">−</button><b>${tx.k}</b><button class="btn" data-q="k+" aria-label="Plus">+</button></span></div>
  ${sum(amt,'L’organisateur')}${payLine()}<button class="btn pri w" data-act="tok" ${tx.a+tx.k?'':'disabled'}>Payer ${fmt(amt)}</button><p class="sm mut" style="text-align:center">Billets électroniques envoyés par courriel. Paiement simulé.</p>`)}
function proofSheet(){const o=me().pilote.obj[pf.i];
  openSheet(`${sheetH('Ajouter une preuve de dépense','Objectif : '+esc(o[0]))}${errBox}<div class="fl">
  <label class="f">Description<input type="text" id="pr_d" maxlength="90" placeholder="Ex. Facture — 4 pneus"></label>
  <label class="f">Montant ($)<input type="number" id="pr_m" min="1" inputmode="numeric"></label>
  <div class="row">${pf.photo?`<img src="${pf.photo}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px">`:''}<label class="btn">${pf.photo?'Changer la photo':'Photo de la facture'}<input type="file" accept="image/*" data-photo="proof" hidden></label></div>
  <button class="btn pri w" data-act="prok">Publier la preuve</button></div>`)}
function profSheet(){const a=me();
  openSheet(`${sheetH('Modifier mon profil')}${errBox}<div class="fl">
  <div class="row">${avatar(Object.assign({},a,{photo:UI.ph??a.photo}),1)}<label class="btn">Changer la photo<input type="file" accept="image/*" data-photo="prof" hidden></label>${(UI.ph??a.photo)?'<button class="btn" data-act="nophoto">Retirer</button>':''}</div>
  <label class="f">Prénom et nom<input type="text" id="e_nom" value="${esc(a.nom)}"></label>

function readPhoto(file,max,cb){if(!file||!/^image\//.test(file.type))return toast('Choisissez une image.');const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};img.onerror=()=>toast('Image illisible.');img.src=r.result};r.readAsDataURL(file)}
function giveTo(pid,i,amt,anon){const p=P[pid],a=me();
  if(p.user){const ow=db.accounts[p.user];ow.pilote.obj[i][2]=(+ow.pilote.obj[i][2]||0)+amt;notify(ow.id,`${anon?'Un donateur anonyme':esc(a.nom)} a donné ${fmt(amt)} pour « ${esc(ow.pilote.obj[i][0])} » (vous recevez ${money(amt*.95)}).`,'#p-'+pid);
    const o=ow.pilote.obj[i];if(+o[2]>=+o[1]&&+o[2]-amt<+o[1]){post(ow.pilote.d,`<b>${esc(ow.nom)}</b> a atteint son objectif « ${esc(o[0])} » (${fmt(+o[1])}).`,pid);for(const x of Object.values(db.accounts))if(x.follow[pid]&&x.set.notif.obj&&x.id!==ow.id)notify(x.id,`${esc(ow.nom)} a atteint son objectif « ${esc(o[0])} ».`,'#p-'+pid)}}
  else{db.don[pid]=db.don[pid]||{};db.don[pid][i]=(db.don[pid][i]||0)+amt}
}
const roleSheet=r=>{UI.rd={pil:r==='pil',org:r==='org',com:r==='com'};openSheet(`${sheetH('Ajouter un rôle')}${errBox}${roleForms(UI.rd,age(me().naissance)<18)}<button class="btn pri w" data-act="roleok">Ajouter ce rôle</button><p class="sm mut" style="text-align:center">Vérification d’identité simulée.</p>`)};
const TXT={

 terms:['Conditions d’utilisation','<p>Version de démonstration. Dans la version complète : frais de gestion de 5 % sur toute transaction, vérification d’identité obligatoire pour recevoir des fonds, preuves de dépense exigées pour chaque cagnotte, comptes de mineurs gérés par un parent, remboursement des billets selon la politique de l’organisateur.</p><p class="mut">Texte à faire valider par un avocat avant le lancement.</p>'],

document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='flogin')doLogin()});
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');if(g){UI.err='';location.hash=g.dataset.go;return}
  const lk=ev.target.closest('a[href^="#"]');if(lk&&(lk.closest('.drawer')||lk.closest('#dayz'))){closeSheet();closeDay(true);if(lk.dataset.date)UI.ne={date:lk.dataset.date,end:''}}

  const t=ev.target.closest('[data-act],[data-day],[data-fd],[data-tab],[data-amt],[data-tier],[data-q],[data-th]');if(!t)return;
  const A=t.dataset.act,id=t.dataset.id,a=me();
  if(t.dataset.day){openDay(t.dataset.day,t);return}
  if(t.dataset.th){a.set.theme=t.dataset.th;persist();applyTheme();rerender();return}
  if(t.dataset.fd){const k=t.dataset.fd,ds=UI.f.ds;UI.f.ds=ds.includes(k)?ds.filter(x=>x!==k):[...ds,k];rerender();return}
  if(t.dataset.tab){UI.tab=t.dataset.tab;rerender();return}
  if(t.dataset.amt){don.a=+t.dataset.amt;don.anon=$('#anon').checked;donSheet();return}
  if(t.dataset.tier){sb.t=+t.dataset.tier;subSheet();return}
  if(t.dataset.q){const w=t.dataset.q[0],o=t.dataset.q[1];tx[w]=Math.max(0,Math.min(10,tx[w]+(o==='+'?1:-1)));tixSheet();return}
  switch(A){
   case 'back':if(history.length>1)history.back();else location.hash='fil';break;
   case 'menu':$('#ov').innerHTML=drawerHTML();break;
   case 'bell':location.hash='notifs';break;
   case 'cs':closeSheet();break;
   /* auth */
   case 'suback':UI.err='';if(UI.su.step===1){UI.su={step:1,d:{}};location.hash='bienvenue'}else{UI.su.step--;draw()}break;
   case 'sunext':suNext();break;
   case 'sunophoto':UI.su.d.photo='';draw();break;
   case 'pick':UI.lemail=db.accounts[id].email;UI.err='';draw();setTimeout(()=>{const p=$('#lp');if(p)p.focus()},50);break;
   case 'forgot':toast('Dans la version complète, un lien de réinitialisation est envoyé par courriel.');break;
   case 'logout':logout();break;
   case 'switch':db.cur=null;persist();closeSheet();applyTheme();location.hash='connexion';break;
   /* calendrier */
   case 'mprev':UI.cm--;if(UI.cm<0){UI.cm=11;UI.cy--}rerender();break;
   case 'mnext':UI.cm++;if(UI.cm>11){UI.cm=0;UI.cy++}rerender();break;
   case 'today':UI.cy=TODAY.getFullYear();UI.cm=TODAY.getMonth();rerender();break;
   case 'tf':UI.showF=!UI.showF;rerender();break;
   case 'fr':UI.f={dist:5000,cap:0,ds:[],per:'tous'};rerender();break;
   case 'dz':closeDay();break;
   /* pilotes */
   case 'follow':if(a.follow[id]){delete a.follow[id];toast('Vous ne suivez plus '+unesc(P[id].nom)+'.')}else{a.follow[id]=1;if(P[id].user)notify(P[id].user,`${esc(a.nom)} vous suit maintenant.`,'#moi');toast('Vous serez averti quand ce pilote confirme sa présence à un événement.')}persist();rerender();break;
   case 'claim':toast('Réclamation : pièce d’identité et licence de course demandées, puis vérification par l’équipe Paddock (démo).');break;
   case 'contact':openSheet(`${sheetH('Message à '+P[id].nom)}<textarea id="msg" placeholder="Votre message"></textarea><button class="btn pri w" style="margin-top:10px" data-act="msgok" data-id="${id}">Envoyer</button>`);break;
   case 'msgok':{const m=val('msg');if(!m)return;if(P[id].user)notify(P[id].user,`Message de ${esc(a.nom)} : « ${esc(m.slice(0,140))} »`,'#notifs');persist();closeSheet();toast(P[id].user?'Message envoyé.':'Message envoyé (ce pilote n’a pas de compte dans la démo).');break}
   case 'sub':sb={id,t:a.sub[id]||10};subSheet();break;
   case 'sok':{const b=a.total;a.sub[sb.id]=sb.t;a.total+=sb.t;a.hist.unshift(['Abonnement '+TIERS.find(x=>x[0]==sb.t)[1]+' — '+unesc(P[sb.id].nom),String(sb.t),dl(key(TODAY),{day:'numeric',month:'short'})]);if(P[sb.id].user)notify(P[sb.id].user,`${esc(a.nom)} s’est abonné à votre profil (${fmt(sb.t)}/mois).`,'#moi');persist();closeSheet();toast('Abonnement confirmé : '+fmt(sb.t)+'/mois.'+lvlUp(b));rerender();break}
   case 'sstop':delete a.sub[sb.id];persist();closeSheet();toast('Abonnement annulé.');rerender();break;
   case 'don':don={id,i:+t.dataset.i,a:20,anon:!!a.set.priv.anon};donSheet();break;
   case 'dok':{const b=a.total,an=$('#anon').checked,o=P[don.id].obj[don.i];giveTo(don.id,don.i,don.a,an);a.total+=don.a;a.hist.unshift(['Don à '+unesc(P[don.id].nom)+' — '+unesc(o[0])+(an?' (anonyme)':''),String(don.a),dl(key(TODAY),{day:'numeric',month:'short'})]);persist();closeSheet();toast('Merci! Le pilote reçoit '+money(don.a*.95)+'.'+lvlUp(b));rerender();break}
   /* événements */
   case 'tix':tx={id,a:2,k:0};tixSheet();break;
   case 'tok':{const e=EV[tx.id],amt=tx.a*e.b[1]+tx.k*e.b[2],b=a.total;a.total+=amt;a.hist.unshift(['Billets — '+unesc(e.t),String(amt),dl(key(TODAY),{day:'numeric',month:'short'})]);if(e.org)notify(e.org,`${esc(a.nom)} a acheté ${tx.a+tx.k} billet(s) pour ${e.t} (${fmt(amt)}).`,'#e-'+e.id);persist();closeSheet();toast((tx.a+tx.k)+' billet(s) achetés. Code QR envoyé par courriel (démo).'+lvlUp(b));rerender();break}
   case 'ext':toast('Redirection vers la billetterie de l’organisateur : désactivée dans la démo.');break;
   case 'conf':{const pid=pidOf(a),l=db.conf[id]=db.conf[id]||[],e=EV[id];if(l.includes(pid)||e.p.includes(pid)){db.conf[id]=l.filter(x=>x!==pid);toast('Présence annulée.')}else{l.push(pid);post(a.pilote.d,`<b>${esc(a.nom)}</b> a confirmé sa présence : <a href="#e-${id}">${e.t}</a>.`,pid);
      for(const x of Object.values(db.accounts))if(x.follow[pid]&&x.set.notif.conf&&x.id!==a.id)notify(x.id,`${esc(a.nom)} sera présent à ${e.t} (${dshort(e)}).`,'#e-'+id);if(e.org&&e.org!==a.id)notify(e.org,`${esc(a.nom)} a confirmé sa présence à ${e.t}.`,'#e-'+id);toast('Présence confirmée. Vos suiveurs sont avertis.')}persist();rerender();break}
   case 'ins':{const e=EV[id];openSheet(`${sheetH('Inscription pilote',e.t+' · '+e.s)}${sum(e.ins,'L’organisateur')}${payLine()}<button class="btn pri w" data-act="iok" data-id="${id}">Payer l’inscription ${fmt(e.ins)}</button><p class="sm mut" style="text-align:center">Paiement simulé. Votre présence sera confirmée.</p>`);break}
   case 'iok':{const e=EV[id],pid=pidOf(a);(db.conf[id]=db.conf[id]||[]).includes(pid)||db.conf[id].push(pid);a.hist.unshift(['Inscription — '+unesc(e.t),String(e.ins),dl(key(TODAY),{day:'numeric',month:'short'})]);if(e.org)notify(e.org,`${esc(a.nom)} a payé son inscription à ${e.t} (${fmt(e.ins)}).`,'#e-'+id);
      for(const x of Object.values(db.accounts))if(x.follow[pid]&&x.set.notif.conf&&x.id!==a.id)notify(x.id,`${esc(a.nom)} sera présent à ${e.t}.`,'#e-'+id);persist();closeSheet();toast('Inscription payée et présence confirmée.');rerender();break}
   case 'nesave':saveNE();break;
   case 'delev':openSheet(`${sheetH('Supprimer cet événement?','Les billets vendus seraient remboursés dans la version complète.')}<button class="btn pri w" data-act="delevok" data-id="${id}">Supprimer</button><button class="btn w" style="margin-top:8px" data-act="cs">Annuler</button>`);break;
   case 'delevok':db.ev=db.ev.filter(e=>!(e.id===id&&e.org===a.id));delete db.conf[id];persist();closeSheet();location.hash='calendrier';toast('Événement supprimé.');break;
   /* commandites */
   case 'apply':{const c=C[t.dataset.c];if(!a.roles.pilote){toast('Seuls les pilotes peuvent proposer leur candidature. Ajoutez le rôle pilote dans Mon profil.');break}if(c.user)notify(c.user,`${esc(a.nom)} propose sa candidature pour « ${esc(t.dataset.t)} ».`,'#p-'+pidOf(a));persist();toast('Candidature envoyée à '+unesc(c.nom)+'.');break}
   case 'newoff':openSheet(`${sheetH('Publier une offre de commandite')}${errBox}<div class="fl"><label class="f">Titre<input type="text" id="of_t" maxlength="70" placeholder="Ex. Commandite pneus 2027"></label><label class="f">Disciplines visées<input type="text" id="of_d" placeholder="Ex. Rallye, Drift"></label><label class="f">Nombre de pilotes<input type="text" id="of_n" placeholder="Ex. 2 pilotes"></label><label class="f">Ce que vous offrez et demandez<textarea id="of_x" maxlength="400"></textarea></label><button class="btn pri w" data-act="offok">Publier</button></div>`);break;
   case 'offok':{const o={id:'o'+nid(),c:'uc'+a.id,t:val('of_t'),d:val('of_d')||'Toutes',n:val('of_n')||'—',x:val('of_x')};if(!o.t||!o.x)return serr('Ajoutez un titre et une description.');db.off.push(o);post('any',`<b>${esc(a.com.nom)}</b> publie une offre : <a href="#marche">${esc(o.t)}</a>.`);for(const x of Object.values(db.accounts))if(x.id!==a.id&&x.roles.pilote&&x.set.notif.off)notify(x.id,`Nouvelle offre de ${esc(a.com.nom)} : ${esc(o.t)}`,'#marche');persist();closeSheet();toast('Offre publiée dans le marché.');rerender();break}
   case 'deloff':db.off=db.off.filter(o=>!(o.id===id&&o.c==='uc'+a.id));persist();toast('Offre retirée.');rerender();break;
   /* cagnotte */
   case 'newobj':openSheet(`${sheetH('Nouvel objectif','Ex. pneus, transport, nourriture, inscriptions')}${errBox}<div class="fl"><label class="f">Nom de l’objectif<input type="text" id="ob_n" maxlength="50"></label><label class="f">Montant visé ($)<input type="number" id="ob_c" min="10" inputmode="numeric"></label><button class="btn pri w" data-act="objok">Ajouter</button></div>`);break;
   case 'objok':{const n=val('ob_n'),c=Math.round(+val('ob_c'));if(!n||!(c>=10))return serr('Donnez un nom et un montant d’au moins 10 $.');a.pilote.obj.push([n,c,0,[]]);post(a.pilote.d,`<b>${esc(a.nom)}</b> a ouvert un objectif : « ${esc(n)} » (${fmt(c)}).`,pidOf(a));persist();closeSheet();toast('Objectif ajouté à votre cagnotte.');rerender();break}

   case 'prok':{const d=val('pr_d'),m=Math.round(+val('pr_m'));if(!d||!(m>0))return serr('Ajoutez une description et un montant.');const o=a.pilote.obj[pf.i];o[3].push([d,fmt(m),dl(key(TODAY),{day:'numeric',month:'short',year:'numeric'}),pf.photo]);post(a.pilote.d,`<b>${esc(a.nom)}</b> a publié une preuve de dépense : ${esc(d)} (${fmt(m)}).`,pidOf(a));

   case 'roleok':{const d=UI.rd;readRoleForms(d);const minor=age(a.naissance)<18;if(minor&&(d.org||d.com))return serr('Réservé aux 18 ans et plus.');const e=checkRoleForms(d,minor);if(e)return serr(e);const had=a.roles.pilote;applyRoles(a,d);

   case 'editemail':openSheet(`${sheetH('Courriel')}${errBox}<label class="f">Nouveau courriel<input type="email" id="em" value="${esc(a.email)}"></label><button class="btn pri w" style="margin-top:10px" data-act="emok">Enregistrer</button>`);break;

   case 'editpw':openSheet(`${sheetH('Mot de passe')}${errBox}<div class="fl"><label class="f">Mot de passe actuel<input type="password" id="pw0"></label><label class="f">Nouveau mot de passe<input type="password" id="pw1"></label><button class="btn pri w" data-act="pwok">Enregistrer</button></div>`);break;
   case 'pwok':{if(hpw($('#pw0').value)!==a.pw)return serr('Mot de passe actuel incorrect.');const n=$('#pw1').value;if(n.length<6)return serr('6 caractères ou plus.');a.pw=hpw(n);persist();closeSheet();toast('Mot de passe modifié.');break}
   case 'cards':openSheet(`${sheetH('Moyens de paiement','Démo : seuls les 4 derniers chiffres sont conservés, aucun paiement réel.')}${a.cards.map((c,i)=>`<div class="li" style="padding:0">${ic('p')}<span>${esc(c.brand)} •••• ${esc(c.last4)}${i===0?' <span class="tag r">Par défaut</span>':''}</span><button class="btn sm2 dan sp" data-act="delcard" data-i="${i}">Retirer</button></div>`).join('')||'<p class="mut">Aucune carte enregistrée.</p>'}
     ${errBox}<div class="fl" style="margin-top:12px"><label class="f">Numéro de carte (test : 4242 4242 4242 4242)<input type="text" id="cn" inputmode="numeric" autocomplete="off"></label><button class="btn pri w" data-act="cardok">Ajouter la carte</button></div>`);break;
   case 'cardok':{const n=(val('cn')||'').replace(/\D/g,'');if(n.length<12||n.length>19)return serr('Numéro invalide.');a.cards.push({brand:n[0]==='4'?'Visa':n[0]==='5'?'Mastercard':n[0]==='3'?'Amex':'Carte',last4:n.slice(-4)});persist();closeSheet();toast('Carte ajoutée (démo).');rerender();break}
   case 'delcard':a.cards.splice(+t.dataset.i,1);persist();closeSheet();rerender();break;
   case 'city':openSheet(`${sheetH('Ville de référence','Sert à calculer la distance des événements.')}<select id="cty">${Object.keys(CITIES).map(c=>`<option${c===a.ville?' selected':''}>${c}</option>`).join('')}</select><button class="btn pri w" style="margin-top:10px" data-act="cityok">Enregistrer</button>`);break;
   case 'cityok':a.ville=val('cty');persist();closeSheet();rerender();break;
   case 'lang':openSheet(`${sheetH('Langue')}<button class="tier on"><span class="badge" style="background:var(--yel)">FR</span><span><b>Français</b></span><span>✓</span></button><button class="tier" disabled style="opacity:.5"><span class="badge" style="background:var(--line)">EN</span><span><b>English</b><br><span class="sm mut">Bientôt</span></span><span></span></button>`);break;
   case 'help':case 'terms':case 'privacy':case 'about':openSheet(sheetH(TXT[A][0])+TXT[A][1]);break;
   case 'report':openSheet(`${sheetH('Signaler un problème')}<textarea id="rp" placeholder="Décrivez le problème"></textarea><button class="btn pri w" style="margin-top:10px" data-act="repok">Envoyer</button>`);break;
   case 'repok':closeSheet();toast('Merci! Votre signalement a été envoyé (démo).');break;
   case 'clrn':db.notifs[a.id]=[];persist();rerender();break;
   case 'resetq':openSheet(`${sheetH('Réinitialiser la démo?','Tous les comptes, événements, offres, dons et notifications créés sur ce téléphone seront effacés.')}<button class="btn pri w" data-act="resetok">Tout effacer</button><button class="btn w" style="margin-top:8px" data-act="cs">Annuler</button>`);break;
   case 'resetok':try{localStorage.removeItem(LS)}catch(e){}db={accounts:{},cur:null,don:{},ev:[],ven:{},off:[],conf:{},notifs:{},feed:[],seq:1};closeSheet();applyTheme();location.hash='bienvenue';draw();toast('Démo réinitialisée.');break;
   case 'delaccq':openSheet(`${sheetH('Supprimer mon compte?','Votre profil, vos événements et vos offres seront effacés de cet appareil.')}<button class="btn pri w" data-act="delaccok">Supprimer définitivement</button><button class="btn w" style="margin-top:8px" data-act="cs">Annuler</button>`);break;
   case 'delaccok':{const pid=pidOf(a);db.ev=db.ev.filter(e=>e.org!==a.id);db.off=db.off.filter(o=>o.c!=='uc'+a.id);for(const k in db.conf)db.conf[k]=db.conf[k].filter(x=>x!==pid);db.feed=db.feed.filter(f=>f.p!==pid);for(const x of Object.values(db.accounts)){delete x.follow[pid];delete x.sub[pid]}delete db.notifs[a.id];delete db.accounts[a.id];db.cur=null;persist();closeSheet();applyTheme();location.hash='bienvenue';toast('Compte supprimé.');break}
  }
});
document.addEventListener('change',ev=>{const t=ev.target,a=me();
  if(t.dataset.set&&a){const [g,k]=t.dataset.set.split('.');a.set[g][k]=t.checked?1:0;persist();if(g==='priv'&&k==='pub')toast(t.checked?'Profil public.':'Profil masqué de Découvrir.');return}
  if(t.dataset.photo){const f=t.files&&t.files[0],w=t.dataset.photo;readPhoto(f,w==='proof'?720:360,url=>{if(w==='su'){UI.su.d.photo=url;draw()}else if(w==='prof'){UI.ph=url;profSheet()}else if(w==='proof'){const d=val('pr_d'),m=val('pr_m');pf.photo=url;proofSheet();$('#pr_d').value=d||'';$('#pr_m').value=m||''}});return}
  if(t.id==='fd')rerender();if(t.id==='fc'){UI.f.cap=+t.value;rerender()}if(t.id==='fp'){UI.f.per=t.value;rerender()}
  if(t.id==='n_tr'){$('#n_newv').style.display=t.value==='_new'?'':'none'}
  if(t.id==='n_bm'){$('#n_bsite').style.display=t.value==='ext'?'none':'';$('#n_bext').style.display=t.value==='ext'?'':'none'}
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='fd'){UI.f.dist=+t.value;$('#dv').textContent=t.value>=5000?'partout':'jusqu’à '+(+t.value).toLocaleString('fr-CA')+' km'}
  if(t.id==='q'){UI.q=t.value;const pos=t.selectionStart;rerender();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='ca'){const v=Math.round(+t.value||0);if(v>=2){don.a=v;$('#sm').innerHTML=sum(v,'Le pilote');document.querySelector('[data-act=dok]').textContent='Donner '+fmt(v);document.querySelectorAll('[data-amt]').forEach(b=>b.classList.remove('on'))}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeSheet();closeDay()}});
addEventListener('hashchange',render);
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
applyTheme();render();

}
</script></body></html>
